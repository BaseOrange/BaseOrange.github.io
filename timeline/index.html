    var map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
    return text.replace(/[&<>"']/g, function(m) { return map[m]; });
  }

  // ==============================================================
  //  渲染时间轴
  // ==============================================================
  function render() {
    var root = document.getElementById('timeline-root');
    if (!root) return;

    var html = 
      '<div class="page-wrapper">'+
        '<header class="page-header">'+
          '<h1>Timeline</h1>'+
          '<p>里程碑 · 创新旅程</p>'+
        '</header>'+
        '<div class="timeline" id="timelineContainer">';

    if (!timelineData || timelineData.length === 0) {
      html += 
        '<div class="empty-state">'+
          '<span>✨</span>'+
          '还没有时间轴数据，请在 <code style="background:#e5e5ea;padding:2px 8px;border-radius:6px;">timelineData</code> 中添加条目。'+
        '</div>';
    } else {
      for (var i = 0; i < timelineData.length; i++) {
        var item = timelineData[i];
        var date = escapeHtml(item.date || '');
        var title = escapeHtml(item.title || '');
        var desc = escapeHtml(item.description || '');
        html += 
          '<div class="timeline-item">'+
            '<div class="timeline-content">'+
              '<div class="card">'+
                '<span class="timeline-date">'+date+'</span>'+
                '<div class="timeline-title">'+title+'</div>'+
                '<div class="timeline-description">'+desc+'</div>'+
              '</div>'+
            '</div>'+
            '<div class="timeline-marker"></div>'+
          '</div>';
      }
    }

    html += '</div></div>';
    root.innerHTML = html;
  }

  // ==============================================================
  //  执行
  // ==============================================================
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', render);
  } else {
    render();
  }
})();
</script>
